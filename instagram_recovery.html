<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram Recovery Tool</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090914;color:white;font-family:Arial,sans-serif;padding:20px}
.container{max-width:420px;margin:50px auto;background:#171725;padding:25px;border-radius:18px;border:1px solid #333}
h2{text-align:center}
p{text-align:center;color:#aaa}
label{display:block;margin:20px 0 8px}
input{width:100%;padding:14px;border-radius:9px;background:#0c0c18;color:white;border:1px solid #444;font-size:15px}
button{width:100%;padding:14px;margin-top:15px;border:0;border-radius:9px;background:#c13584;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button:hover{opacity:.85}
#result{display:none;margin-top:20px;padding:15px;background:#0c0c18;border-radius:10px;line-height:2}
</style>
</head>
<body>
<div class="container">
<h2>📸 Instagram Recovery</h2>
<p>أداة استعادة الحساب</p>
<label for="username">اسم المستخدم</label>
<input id="username" placeholder="@username" autocomplete="off">
<button onclick="prepare()">تجهيز طلب الاستعادة</button>
<div id="result">
<h3>طلب استعادة الحساب</h3>
<p id="account"></p>
<button onclick="copyData()">نسخ البيانات</button>
<button onclick="openRecovery()">فتح صفحة الاستعادة الرسمية</button>
</div>
</div>
<script>
let recoveryData="";
function prepare(){
  const user=document.getElementById("username").value.trim();
  if(!user){alert("أدخل اسم المستخدم");return;}
  recoveryData="Instagram account recovery request\nUsername: "+user;
  document.getElementById("account").textContent="الحساب المطلوب استعادته: "+user;
  document.getElementById("result").style.display="block";
}
async function copyData(){
  if(!recoveryData)return;
  try{await navigator.clipboard.writeText(recoveryData);alert("تم نسخ البيانات");}
  catch(e){alert("تعذر النسخ؛ انسخ النص يدوياً.");}
}
function openRecovery(){
  window.open("https://www.instagram.com/accounts/password/reset/","_blank","noopener");
}
</script>
</body>
</html>
